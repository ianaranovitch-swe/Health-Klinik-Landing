# Конфиг только для API-сервиса (Root Directory = backend)
# Сервис telegram-bot должен использовать railway.bot.toml (см. docs/STAGE4_TELEGRAM_BOT.md)
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# shell обязателен: иначе Railway передаёт буквально "$PORT"
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
